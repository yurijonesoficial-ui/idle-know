name: Baixar código do jogo (dev)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar game-*.js
        run: |
          UA="IdleKnow/1.0 (+https://idle-know.pages.dev)"
          H=$(curl -sfA "$UA" https://baiakidle.com/jogar/)
          G=$(echo "$H" | grep -o 'assets/game-[A-Za-z0-9_-]*\.js' | head -1)
          echo "arquivo: $G"
          mkdir -p out && curl -sfA "$UA" "https://baiakidle.com/jogar/$G" -o out/game.js && ls -la out
      - name: Publicar no branch dev-jogo
        run: |
          cd out && git init -q -b dev-jogo && git add game.js
          git -c user.name=idle-know-bot -c user.email=idle-know-bot@users.noreply.github.com commit -qm "game.js $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dev-jogo
