name: Coletar market

on:
  schedule:
    - cron: '17 */6 * * *'   # a cada 6 horas
  workflow_dispatch:          # botão "Run workflow" para rodar na mão

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coletar
        run: node scripts/coletar.mjs
      - name: Salvar dados
        run: |
          git config user.name "idle-know-bot"
          git config user.email "idle-know-bot@users.noreply.github.com"
          git add -A dados public/data
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -m "dados: coleta $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
